name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Benchmark harness tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run traced OpenAI-compatible fixture benchmark
        shell: bash
        run: |
          set -euo pipefail
          PORT_FILE=$(mktemp)
          TRACE_FILE=$(mktemp)
          RESULT_DIR=$(mktemp -d)
          python tests/openai_fixture_server.py \
            --port-file "$PORT_FILE" \
            --trace-file "$TRACE_FILE" &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true; rm -rf "$PORT_FILE" "$TRACE_FILE" "$RESULT_DIR"' EXIT
          for _ in {1..100}; do
            if [ -s "$PORT_FILE" ]; then
              break
            fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
              echo "OpenAI fixture exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -s "$PORT_FILE"
          PORT=$(<"$PORT_FILE")

          python benchmark.py \
            --mode openai \
            --server-url "http://127.0.0.1:${PORT}" \
            --model-name fixture-model \
            --warmup-requests 2 \
            --num-requests 6 \
            --concurrency 3 \
            --retries 0 \
            --request-rate-rps 20 \
            --propagate-trace-context \
            --fail-on-trace-context-gap \
            --prometheus \
            --output-dir "$RESULT_DIR"

          python - "$TRACE_FILE" "$RESULT_DIR" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          trace_path = Path(sys.argv[1])
          result_dir = Path(sys.argv[2])
          traceparents = trace_path.read_text(encoding="utf-8").splitlines()
          pattern = re.compile(
              r"^00-(?!0{32})[0-9a-f]{32}-(?!0{16})[0-9a-f]{16}-01$"
          )
          assert len(traceparents) == 8, traceparents
          assert len(set(traceparents)) == 8, traceparents
          assert all(pattern.fullmatch(value) for value in traceparents)

          results = sorted(result_dir.glob("benchmark_*.json"))
          assert len(results) == 1, results
          prometheus_path = results[0].with_suffix(".prom")
          metrics = json.loads(results[0].read_text(encoding="utf-8"))
          serialized = results[0].read_text(encoding="utf-8") + prometheus_path.read_text(
              encoding="utf-8"
          )
          continuation = metrics["trace_context"]["response_continuation"]
          schedule = metrics["load_schedule"]
          assert schedule["mode"] == "open_loop_constant_rate"
          assert schedule["configured_request_rate_rps"] == 20
          assert schedule["request_count"] == 6
          assert schedule["scheduled_submission_span_seconds"] == 0.25
          assert schedule["achieved_submission_rate_rps"] > 0
          assert schedule["achieved_request_start_rate_rps"] > 0
          assert schedule["submission_lag_ms"]["p95"] >= 0
          assert schedule["executor_queue_ms"]["p95"] >= 0
          assert schedule["request_start_lag_ms"]["p95"] >= 0
          assert metrics["trace_context"]["propagation"] == "w3c_traceparent"
          assert metrics["trace_context"]["identifiers_persisted"] is False
          assert continuation["request_count"] == 6
          assert continuation["matched_responses"] == 6
          assert continuation["missing_responses"] == 0
          assert continuation["invalid_responses"] == 0
          assert continuation["mismatched_responses"] == 0
          assert continuation["match_coverage"] == 1.0
          assert continuation["complete"] is True
          assert continuation["identifiers_persisted"] is False
          assert metrics["trace_context_gate"]["passed"] is True
          assert metrics["trace_context_gate"]["failure_reasons"] == []
          assert metrics["warmup"]["request_count"] == 2
          assert metrics["num_requests"] == 6
          assert "triton_benchmark_trace_context_enabled" in serialized
          assert "triton_benchmark_configured_request_rate_rps" in serialized
          assert "triton_benchmark_submission_lag_ms" in serialized
          assert "triton_benchmark_achieved_request_start_rate_rps" in serialized
          assert "triton_benchmark_executor_queue_ms" in serialized
          assert "triton_benchmark_request_start_lag_ms" in serialized
          assert "triton_benchmark_trace_response_match_coverage" in serialized
          assert "triton_benchmark_trace_context_gate_passed" in serialized
          assert all(value not in serialized for value in traceparents)
          assert not re.search(
              r"00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}", serialized
          )
          assert "fixture benchmark prompt" not in serialized
          assert "Authorization" not in serialized
          PY

      - name: Run transient-failure retry amplification gate
        shell: bash
        run: |
          set -euo pipefail
          PORT_FILE=$(mktemp)
          TRACE_FILE=$(mktemp)
          RESULT_DIR=$(mktemp -d)
          python tests/openai_fixture_server.py \
            --port-file "$PORT_FILE" \
            --trace-file "$TRACE_FILE" \
            --fail-first-requests 1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true; rm -rf "$PORT_FILE" "$TRACE_FILE" "$RESULT_DIR"' EXIT
          for _ in {1..100}; do
            if [ -s "$PORT_FILE" ]; then
              break
            fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
              echo "retry fixture exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -s "$PORT_FILE"
          PORT=$(<"$PORT_FILE")

          python benchmark.py \
            --mode openai \
            --server-url "http://127.0.0.1:${PORT}" \
            --model-name fixture-model \
            --num-requests 4 \
            --concurrency 1 \
            --retries 1 \
            --propagate-trace-context \
            --max-client-attempt-amplification 1.25 \
            --fail-on-retry-gate \
            --prometheus \
            --output-dir "$RESULT_DIR"

          python - "$TRACE_FILE" "$RESULT_DIR" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          trace_path = Path(sys.argv[1])
          result_dir = Path(sys.argv[2])
          traceparents = trace_path.read_text(encoding="utf-8").splitlines()
          assert len(traceparents) == 5, traceparents
          assert len(set(traceparents)) == 5, traceparents

          results = sorted(result_dir.glob("benchmark_*.json"))
          assert len(results) == 1, results
          metrics = json.loads(results[0].read_text(encoding="utf-8"))
          retry = metrics["retry"]
          assert retry["logical_requests"] == 4
          assert retry["client_attempts"] == 5
          assert retry["retry_attempts"] == 1
          assert retry["retried_requests"] == 1
          assert retry["recovered_requests"] == 1
          assert retry["exhausted_requests"] == 0
          assert retry["client_attempt_amplification"] == 1.25
          assert metrics["retry_gate"]["passed"] is True
          assert metrics["retry_gate"]["failure_reasons"] == []
          assert metrics["retry_gate"]["scope"].startswith("measured")

          prometheus = results[0].with_suffix(".prom").read_text(encoding="utf-8")
          assert "triton_benchmark_client_attempts_total" in prometheus
          assert "triton_benchmark_retry_attempts_total" in prometheus
          assert "triton_benchmark_recovered_requests_total" in prometheus
          assert "triton_benchmark_client_attempt_amplification" in prometheus
          assert "triton_benchmark_retry_gate_passed" in prometheus
          assert "triton_benchmark_retry_gate_max_amplification" in prometheus
          serialized = results[0].read_text(encoding="utf-8") + prometheus
          assert all(value not in serialized for value in traceparents)
          assert not re.search(
              r"00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}", serialized
          )
          assert "Return a short deterministic benchmark response." not in serialized
          assert "Authorization" not in serialized
          PY

      - name: Run bracketed-telemetry mock benchmark
        shell: bash
        run: |
          set -euo pipefail
          PORT_FILE=$(mktemp)
          python tests/telemetry_fixture_server.py --port-file "$PORT_FILE" &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true; rm -f "$PORT_FILE"' EXIT
          for _ in {1..100}; do
            if [ -s "$PORT_FILE" ]; then
              break
            fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
              echo "telemetry fixture exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -s "$PORT_FILE"
          PORT=$(<"$PORT_FILE")

          python benchmark.py \
            --mode mock \
            --warmup-requests 4 \
            --num-requests 20 \
            --concurrency 4 \
            --batch-invariance-probes 8 \
            --batch-output-atol 0.0001 \
            --batch-output-rtol 0.001 \
            --fail-on-batch-variance \
            --input-tokens-per-request 1024 \
            --output-tokens-per-request 256 \
            --gpu-count 2 \
            --gpu-hourly-cost-usd 4.50 \
            --power-watts-per-gpu 600 \
            --context-tokens-per-request 1024 \
            --llm-batch-size 4 \
            --time-to-first-token-ms 25 \
            --inter-token-latency-ms 10 \
            --kv-cache-bytes-per-request 58720256 \
            --bytes-read-per-output-token 777458304 \
            --baseline-quality-score 0.80 \
            --candidate-quality-score 0.79 \
            --telemetry-url "http://127.0.0.1:${PORT}/metrics" \
            --telemetry-sample-interval-seconds 0.01 \
            --max-server-failure-rate 0.02 \
            --max-server-queue-fraction 0.10 \
            --fail-on-telemetry-gate \
            --prometheus \
            --output-dir benchmark_results

          python - <<'PY'
          import json
          from pathlib import Path

          results = sorted(Path("benchmark_results").glob("benchmark_*.json"))
          assert len(results) == 1, results
          metrics = json.loads(results[0].read_text(encoding="utf-8"))
          assert metrics["telemetry"]["source"] == "http_prometheus_snapshot"
          assert metrics["telemetry_window"]["source"] == "paired_http_prometheus_scrapes"
          assert metrics["telemetry_window"]["alignment"] == "harness_bracketed_measured_phase"
          assert metrics["telemetry_window"]["derived"]["request_total"] == 101
          assert metrics["telemetry_window"]["series_membership"]["stable"] is True
          assert len(
              metrics["telemetry_window"]["series_membership"]["fingerprint_sha256"]
          ) == 64
          assert metrics["telemetry_gate"]["passed"] is True
          batch_gate = metrics["batch_invariance"]
          assert batch_gate["passed"] is True
          assert batch_gate["exact_match"] is True
          assert batch_gate["exact_matches"] == 8
          assert batch_gate["tolerance_matches"] == 0
          assert batch_gate["numeric_comparisons"] == 8
          assert batch_gate["max_observed_absolute_error"] == 0
          assert batch_gate["max_observed_relative_error"] == 0
          assert batch_gate["comparison_policy"]["mode"] == "numeric_tolerance"
          assert batch_gate["comparison_policy"]["absolute_tolerance"] == 0.0001
          assert batch_gate["comparison_policy"]["relative_tolerance"] == 0.001
          assert batch_gate["comparison_policy"]["output_values_persisted"] is False
          assert batch_gate["comparison_policy"]["output_fingerprints_persisted"] is False
          gauge_window = metrics["telemetry_gauge_window"]
          assert gauge_window["in_window_scrape_count"] >= 2
          assert (
              gauge_window["scrape_count"]
              == gauge_window["in_window_scrape_count"] + 2
          )
          assert gauge_window["gpu"]["utilization_pct"]["sample_count"] >= 4
          assert gauge_window["series_membership"]["stable"] is True
          assert len(gauge_window["series_membership"]["fingerprint_sha256"]) == 64
          assert results[0].with_suffix(".prom").is_file()
          prometheus = results[0].with_suffix(".prom").read_text(encoding="utf-8")
          assert "triton_benchmark_server_series_membership_stable" in prometheus
          assert "triton_benchmark_gpu_window_series_membership_stable" in prometheus
          assert "triton_benchmark_batch_invariance_passed" in prometheus
          assert "triton_benchmark_batch_invariance_exact_matches_total" in prometheus
          assert "triton_benchmark_batch_invariance_tolerance_matches_total" in prometheus
          assert "triton_benchmark_batch_invariance_absolute_tolerance" in prometheus
          assert "triton_benchmark_batch_invariance_relative_tolerance" in prometheus
          serialized = json.dumps(metrics)
          assert "127.0.0.1" not in serialized
          assert "nv_inference_request_success" not in serialized
          assert '"version"' not in serialized
          PY
